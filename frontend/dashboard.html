<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecureAttend | Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        body {
            background: #f5f7fb;
        }

        .dashboard-page {
            min-height: 100vh;
        }

        .dashboard-nav {
            height: 72px;

            background: white;

            border-bottom: 1px solid #e2e6ef;

            display: flex;

            align-items: center;
            justify-content: space-between;

            padding: 0 6%;

        }

        .dashboard-brand {
            display: flex;

            align-items: center;

            gap: 10px;

            font-family: "Space Grotesk", sans-serif;

            font-weight: 700;

            font-size: 19px;
        }

        .dashboard-brand .brand-icon {
            background: #eef1ff;

            color: #3157d5;

            border: none;
        }

        .logout-button {
            border: 1px solid #e2e6ef;

            background: white;

            padding: 9px 16px;

            border-radius: 8px;

            cursor: pointer;

            font-family: inherit;

            font-size: 13px;

            font-weight: 600;

            color: #697087;

            transition: 0.2s;
        }

        .logout-button:hover {
            border-color: #3157d5;

            color: #3157d5;
        }

        .dashboard-content {
            max-width: 1100px;

            margin: 0 auto;

            padding: 55px 25px;
        }

        .welcome-section {
            margin-bottom: 35px;
        }

        .welcome-section span {
            color: #3157d5;

            font-size: 11px;

            letter-spacing: 2px;

            font-weight: 700;
        }

        .welcome-section h1 {
            font-family: "Space Grotesk", sans-serif;

            font-size: 38px;

            margin-top: 8px;

            letter-spacing: -1px;
        }

        .welcome-section p {
            color: #697087;

            margin-top: 7px;

            font-size: 14px;
        }

        .dashboard-grid {
            display: grid;

            grid-template-columns: 2fr 1fr;

            gap: 20px;
        }

        .dashboard-card {
            background: white;

            border: 1px solid #e2e6ef;

            border-radius: 14px;

            padding: 25px;
        }

        .card-label {
            font-size: 11px;

            color: #697087;

            letter-spacing: 1.5px;

            font-weight: 700;
        }

        .profile-name {
            font-family: "Space Grotesk", sans-serif;

            font-size: 27px;

            margin-top: 10px;
        }

        .profile-detail {
            display: flex;

            justify-content: space-between;

            padding: 13px 0;

            border-bottom: 1px solid #edf0f5;

            font-size: 13px;
        }

        .profile-detail:last-child {
            border-bottom: none;
        }

        .profile-detail span:first-child {
            color: #697087;
        }

        .profile-detail span:last-child {
            font-weight: 600;
        }

        .empty-state {
            text-align: center;

            padding: 50px 20px;
        }

        .empty-icon {
            width: 50px;
            height: 50px;

            border-radius: 12px;

            background: #eef1ff;

            color: #3157d5;

            display: flex;

            align-items: center;
            justify-content: center;

            margin: 0 auto 15px;

            font-size: 20px;
        }

        .empty-state h3 {
            font-family: "Space Grotesk", sans-serif;

            font-size: 18px;
        }

        .empty-state p {
            color: #697087;

            font-size: 13px;

            margin-top: 7px;
        }

        @media (max-width: 750px) {

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .dashboard-nav {
                padding: 0 20px;
            }

            .dashboard-content {
                padding: 35px 20px;
            }

        }

    </style>

</head>


<body>

    <div class="dashboard-page">


        <nav class="dashboard-nav">

            <div class="dashboard-brand">

                <div class="brand-icon">
                    ✓
                </div>

                <span>
                    SecureAttend
                </span>

            </div>


            <button
                id="logoutButton"
                class="logout-button"
            >
                Logout
            </button>

        </nav>


        <main class="dashboard-content">


            <section class="welcome-section">

                <span>
                    STUDENT DASHBOARD
                </span>

                <h1>
                    Welcome, <span id="studentName">Student</span> 👋
                </h1>

                <p>
                    Your SecureAttend account is ready.
                </p>

            </section>


            <div class="dashboard-grid">


                <div class="dashboard-card">

                    <div class="card-label">
                        ATTENDANCE
                    </div>


                    <div class="empty-state">

                        <div class="empty-icon">
                            ✓
                        </div>

                        <h3>
                            No active session
                        </h3>

                        <p>
                            When your teacher starts an attendance
                            session, it will appear here.
                        </p>

                    </div>

                </div>


                <div class="dashboard-card">

                    <div class="card-label">
                        YOUR PROFILE
                    </div>


                    <div class="profile-name"
                         id="profileName">
                        Student
                    </div>


                    <div class="profile-detail">

                        <span>
                            Roll Number
                        </span>

                        <span id="profileRoll">
                            —
                        </span>

                    </div>


                    <div class="profile-detail">

                        <span>
                            Email
                        </span>

                        <span id="profileEmail">
                            —
                        </span>

                    </div>

                </div>


            </div>

        </main>

    </div>


    <script src="js/dashboard.js"></script>

</body>

</html>
