<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SecureAttend | Redirecting...</title>
</head>
<body>
    <script src="js/auth.js"></script>
    <script>
        const user = window.Auth.getCurrentUser();
        if (user) {
            window.location.href = window.Auth.getDashboardUrl(user.role);
        } else {
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
